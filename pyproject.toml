[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nawah"
version = "3.0.0"
description = "A skill layer over any model: it accumulates, verifies, routes and transfers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mbare12" }]
keywords = ["agent", "skills", "continual-learning", "routing", "agi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "black"]

[project.urls]
Documentation = "docs/ARCHITECTURE.md"

[project.scripts]
nawah = "nawah.cli:main"

[tool.setuptools]
packages = ["nawah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.black]
line-length = 79
target-version = ["py39"]

[tool.ruff]
line-length = 79
target-version = "py39"
exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # function call in a default argument: intentional in the CLI
    "RUF012",  # see the note in backend.py -- deliberate class-level table
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
